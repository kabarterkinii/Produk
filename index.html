<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berita Terkini</title>
  
  <!-- Ini buat preview di WA, FB, IG -->
  <meta property="og:title" content="Berita Terkini">
  <meta property="og:description" content="Viral hari ini">
  <meta property="og:image" content="https://kabarterkinii.github.io/Produk/foto.jpg?v=5">
  <meta property="og:url" content="https://kabarterkinii.github.io/Produk/">
  <meta name="theme-color" content="#2563eb">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2563eb;
      text-align: center;
      margin-bottom: 10px;
    }
    .sub {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }
    img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .berita {
      line-height: 1.6;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Berita Terkini</h1>
    <p class="sub">Viral hari ini</p>
    
    <img src="foto.jpg?v=5" alt="Berita Viral">
    
    <div class="berita">
      <h2>Judul Berita Kamu</h2>
      <p>Tulis isi beritanya di sini. 
      Kamu bisa ganti gambar `foto.jpg` dengan gambar berita lain.
      Jangan lupa tiap update gambar/teks, ganti `?v=5` jadi `?v=6` biar langsung ke-update.</p>
    </div>
  </div>
</body>
</html>
